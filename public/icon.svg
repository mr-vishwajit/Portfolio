<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#030712" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="50%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#2dd4bf" stroke-width="4" stroke-opacity="0.25" />

  <!-- Data Grid Lines in background -->
  <g opacity="0.15" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,6">
    <line x1="96" y1="160" x2="416" y2="160" />
    <line x1="96" y1="230" x2="416" y2="230" />
    <line x1="96" y1="300" x2="416" y2="300" />
    <line x1="96" y1="370" x2="416" y2="370" />
  </g>

  <!-- Stylized Data Bars (Analytics) -->
  <g transform="translate(0, 20)">
    <rect x="110" y="270" width="44" height="110" rx="10" fill="#1e293b" />
    <rect x="110" y="290" width="44" height="90" rx="10" fill="url(#cyanGrad)" opacity="0.8" />

    <rect x="178" y="210" width="44" height="170" rx="10" fill="#1e293b" />
    <rect x="178" y="230" width="44" height="150" rx="10" fill="url(#tealGrad)" />

    <rect x="246" y="150" width="44" height="230" rx="10" fill="#1e293b" />
    <rect x="246" y="165" width="44" height="215" rx="10" fill="url(#cyanGrad)" />

    <rect x="314" y="230" width="44" height="150" rx="10" fill="#1e293b" />
    <rect x="314" y="250" width="44" height="130" rx="10" fill="url(#tealGrad)" />

    <rect x="382" y="120" width="44" height="260" rx="10" fill="#1e293b" />
    <rect x="382" y="135" width="44" height="245" rx="10" fill="url(#tealGrad)" filter="url(#glow)" />
  </g>

  <!-- Growth Trend / Metric Line with Data Nodes -->
  <g filter="url(#glow)">
    <path d="M 132 300 L 200 240 L 268 180 L 336 260 L 404 145" fill="none" stroke="#5eead4" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Data Nodes -->
  <circle cx="132" cy="300" r="10" fill="#ffffff" stroke="#0d9488" stroke-width="4" />
  <circle cx="200" cy="240" r="10" fill="#ffffff" stroke="#0d9488" stroke-width="4" />
  <circle cx="268" cy="180" r="10" fill="#ffffff" stroke="#0d9488" stroke-width="4" />
  <circle cx="336" cy="260" r="10" fill="#ffffff" stroke="#0d9488" stroke-width="4" />
  <circle cx="404" cy="145" r="12" fill="#5eead4" stroke="#ffffff" stroke-width="4" filter="url(#glow)" />

  <!-- Monogram Badge "V" at bottom left -->
  <g transform="translate(100, 395)">
    <rect width="312" height="42" rx="12" fill="#020617" fill-opacity="0.9" stroke="#2dd4bf" stroke-width="1.5" />
    <text x="156" y="27" fill="#f8fafc" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="20" letter-spacing="4" text-anchor="middle">VISHWAJIT</text>
  </g>
</svg>
